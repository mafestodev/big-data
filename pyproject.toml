[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wildlife-reid"
version = "0.1.0"
description = "Swin Transformer and ArcFace wildlife re-identification system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.0,<4",
  "numpy>=1.26,<3",
  "Pillow>=10,<12",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
  "timm>=1.0,<2",
    "transformers>=4.40,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
wildlife-api = "wildlife_reid.api.app:main"
wildlife-train = "wildlife_reid.training.train:main"
wildlife-build-gallery = "wildlife_reid.gallery.build_gallery:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

